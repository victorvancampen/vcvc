<div class="spotify-embed" style="margin: 1.5rem 0; width: 100%;">
  <iframe 
    src="https://spotify.com{{ .Get "type" }}/{{ .Get "id" }}{{ if .Get "time" }}?time={{ .Get "time" }}{{ else }}?utm_source=generator&theme=0{{ end }}" 
    width="100%" 
    height="152" 
    frameBorder="0" 
    allowfullscreen="" 
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
    loading="lazy">
  </iframe>
</div>
